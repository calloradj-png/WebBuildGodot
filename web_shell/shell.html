<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>$GODOT_PROJECT_NAME</title>
    $GODOT_HEAD_INCLUDE
    <style>
        :root {
            --bg-color: #0d0f12;
            --accent-color: #4387f6;
            --accent-glow: rgba(67, 135, 246, 0.4);
            --text-color: #e6edf3;
            --muted-color: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }

        #canvas {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            outline: none;
            border: none;
            z-index: 1;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: radial-gradient(circle at center, #161b22 0%, #0d0f12 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
        }

        .loader-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 320px;
            width: 85%;
            text-align: center;
        }

        .spinner-ring {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
            animation: spin 0.8s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 18px;
            color: #ffffff;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 3px;
            transition: width 0.15s ease-out;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.82rem;
            color: var(--muted-color);
            font-weight: 500;
        }

        #error-notice {
            display: none;
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 6px;
            color: #fca5a5;
            font-size: 0.82rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <canvas id="canvas">
        Ваш браузер не поддерживает HTML5 Canvas.
    </canvas>

    <div id="loading-screen">
        <div class="loader-card">
            <div class="spinner-ring" id="spinner"></div>
            <div class="game-title">$GODOT_PROJECT_NAME</div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="status-row">
                <span id="status-label">Загрузка...</span>
                <span id="status-percent">0%</span>
            </div>
            <div id="error-notice"></div>
        </div>
    </div>

    <script src="$GODOT_URL"></script>
    <script>
        (function() {
            const loadingScreen = document.getElementById('loading-screen');
            const progressFill = document.getElementById('progress-fill');
            const statusLabel = document.getElementById('status-label');
            const statusPercent = document.getElementById('status-percent');
            const errorNotice = document.getElementById('error-notice');
            const spinner = document.getElementById('spinner');

            function showError(err) {
                const message = (err && err.message) ? err.message : String(err);
                errorNotice.textContent = message;
                errorNotice.style.display = 'block';
                spinner.style.borderTopColor = '#ef4444';
                spinner.style.boxShadow = '0 0 15px rgba(239, 68, 68, 0.4)';
                statusLabel.textContent = 'Ошибка запуска';
            }

            if (!Engine.isWebGLAvailable()) {
                showError('Браузер или видеокарта не поддерживает WebGL 2.0.');
                return;
            }

            const engine = new Engine($GODOT_CONFIG);

            engine.startGame({
                'onProgress': function(current, total) {
                    if (total > 0) {
                        const pct = Math.min(100, Math.round((current / total) * 100));
                        progressFill.style.width = pct + '%';
                        statusPercent.textContent = pct + '%';
                        if (pct >= 100) {
                            statusLabel.textContent = 'Запуск...';
                        }
                    }
                }
            }).then(() => {
                progressFill.style.width = '100%';
                statusPercent.textContent = '100%';
                statusLabel.textContent = 'Готово';

                // Buffer short frame to avoid canvas flash
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        loadingScreen.style.opacity = '0';
                        loadingScreen.style.visibility = 'hidden';
                        setTimeout(() => {
                            loadingScreen.remove();
                        }, 400);
                    });
                });
            }).catch(showError);
        })();
    </script>
</body>
</html>
